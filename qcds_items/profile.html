<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCDS Identity</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#f2f2f2;
}

/* HEADER */
.header {
    background: linear-gradient(135deg,#cfa95d,#8b6b2f);
    text-align:center;
    padding:40px 20px;
    color:white;
}

.profile-img {
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid white;
    object-fit:cover;
}

/* CARD */
.container {
    max-width:500px;
    margin:-40px auto 20px;
    background:white;
    padding:20px;
    border-radius:12px;
}

/* LINKS */
.link {
    display:flex;
    justify-content:space-between;
    padding:12px;
    margin:10px 0;
    background:#f5f5f5;
    border-radius:10px;
    text-decoration:none;
    color:black;
}

/* QR */
#qrcode {
    margin-top:20px;
    text-align:center;
}
</style>
</head>

<body>

<div class="header">
    <h2>QCDS</h2>
    <img id="img" class="profile-img">
    <h3 id="name"></h3>
    <p id="role"></p>
</div>

<div class="container">

    <p id="bio"></p>

    <div id="links"></div>

    <div id="qrcode"></div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyzHudH8CCelv8e22EGQxdHg1oRIOdPg-GAqofoIUQRAh-MDxPyAw7KR5Y3KuZYQ8_VDA/exec"; // 🔥 paste your script URL

const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");

// N/A handler
const safe = (v) => v && v !== "" ? v : "N/A";

fetch(`${API}?type=profile&uid=${uid}`)
.then(res => res.json())
.then(user => {

    if(user.error){
        document.body.innerHTML = "<h2>User Not Found</h2>";
        return;
    }

    document.getElementById("name").innerText = safe(user.Name);
    document.getElementById("role").innerText = "QCDS Team";
    document.getElementById("img").src =
        safe(user.Image) !== "N/A"
        ? user.Image
        : "https://via.placeholder.com/150";

    document.getElementById("bio").innerText =
        `${safe(user["Work Type"])} | English: ${safe(user["Do you know English?"])}`;

    let links = `
        <a class="link" href="tel:${safe(user["Contact Number"])}">📞 Call</a>
        <a class="link" href="https://wa.me/91${safe(user["WhatsApp Number"])}">💬 WhatsApp</a>
        <a class="link" href="mailto:${safe(user["Email ID"])}">📧 Email</a>
        <a class="link">💳 UPI: ${safe(user["UPI ID (For Payment)"])}</a>
    `;

    document.getElementById("links").innerHTML = links;

    // 🔥 QR CODE
    const profileURL = window.location.href;
    QRCode.toCanvas(document.createElement('canvas'), profileURL, function (err, canvas) {
        document.getElementById("qrcode").appendChild(canvas);
    });

});
</script>

</body>
</html>
