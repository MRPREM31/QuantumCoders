<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f5f5f5;
}

.header {
    background: linear-gradient(135deg, #cfa95d, #8b6b2f);
    text-align: center;
    padding: 40px 20px;
    color: white;
}

.profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid white;
}

.container {
    max-width: 500px;
    margin: -40px auto 20px;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

.info {
    margin-bottom: 15px;
}

.link-btn {
    display: block;
    padding: 12px;
    margin: 10px 0;
    background: #eee;
    border-radius: 10px;
    text-decoration: none;
    color: black;
}
</style>
</head>

<body>

<div class="header">
    <img id="img" class="profile-img">
    <h2 id="name"></h2>
    <p id="role"></p>
</div>

<div class="container">
    <p id="bio"></p>

    <div id="links"></div>
</div>

<script>
// 🔥 DATABASE (ADD ALL PEOPLE HERE)
const users = {
    prem: {
        name: "Prem Prasad Pradhan",
        role: "Founder",
        img: "assets/prem.jpg",
        bio: "Founder of QuantumCoders Data Solution.",
        links: [
            {name: "WhatsApp", url: "https://wa.me/919827775230"},
            {name: "Website", url: "https://mrprem.in"},
            {name: "Email", url: "mailto:mr.prem2006@gmail.com"}
        ]
    },

    sandip: {
        name: "Sandip Kumar Mohanty",
        role: "Photographer",
        img: "assets/sandip.jpg",
        bio: "Creative photographer.",
        links: [
            {name: "Instagram", url: "#"},
            {name: "Telegram", url: "#"}
        ]
    }
};

// 🔍 GET UID FROM URL
const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");

// 🚨 IF USER NOT FOUND
if (!users[uid]) {
    document.body.innerHTML = "<h2>User Not Found</h2>";
} else {
    const user = users[uid];

    document.getElementById("name").innerText = user.name;
    document.getElementById("role").innerText = user.role;
    document.getElementById("img").src = user.img;
    document.getElementById("bio").innerText = user.bio;

    const linkDiv = document.getElementById("links");

    user.links.forEach(link => {
        linkDiv.innerHTML += `
            <a class="link-btn" href="${link.url}" target="_blank">
                ${link.name}
            </a>
        `;
    });
}
</script>

</body>
</html>
