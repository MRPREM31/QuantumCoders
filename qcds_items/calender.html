<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCDS Calendar — QuantumCoders Data Solutions</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- html2canvas for PNG/JPG export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* ============================================================
   1. DESIGN TOKENS — CSS Variables
   ============================================================ */
:root {
  /* Core Palette — Dark Mode (default) */
  --bg-base:        #050c1a;
  --bg-surface:     #091224;
  --bg-card:        #0c1832;
  --bg-card-hover:  #0f1e3e;
  --bg-modal:       #0a1528;
  --bg-header:      #040b18;

  --border:         rgba(30, 80, 160, 0.35);
  --border-bright:  rgba(40, 130, 220, 0.55);
  --border-glow:    rgba(0, 180, 255, 0.25);

  --cyan:           #00c8ff;
  --cyan-2:         #0090cc;
  --cyan-dim:       rgba(0, 200, 255, 0.10);
  --cyan-glow:      rgba(0, 200, 255, 0.18);

  --accent:         #7c5cfc;
  --accent-dim:     rgba(124, 92, 252, 0.12);
  --accent-glow:    rgba(124, 92, 252, 0.25);

  --gold:           #f4c430;
  --gold-dim:       rgba(244, 196, 48, 0.10);

  --success:        #00e676;
  --danger:         #ff4444;
  --warning:        #ffaa00;

  --sunday-color:   #ff5577;
  --sunday-bg:      rgba(255, 85, 119, 0.07);

  --today-bg:       rgba(0, 200, 255, 0.14);
  --today-border:   #00c8ff;
  --today-glow:     0 0 16px rgba(0, 200, 255, 0.30);

  --event-1: #00c8ff;
  --event-2: #7c5cfc;
  --event-3: #00e676;
  --event-4: #f4c430;
  --event-5: #ff5577;

  --text-primary:   #ddeeff;
  --text-secondary: #7da0c0;
  --text-muted:     #3d6080;

  --shadow-card:    0 4px 24px rgba(0, 0, 0, 0.55);
  --shadow-modal:   0 16px 64px rgba(0, 0, 0, 0.80);
  --radius-sm:      8px;
  --radius:         14px;
  --radius-lg:      20px;
  --radius-xl:      28px;

  --font-display:   'Rajdhani', sans-serif;
  --font-body:      'DM Sans', sans-serif;
  --font-mono:      'JetBrains Mono', monospace;

  --transition:     0.22s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow:0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Light Mode Overrides */
[data-theme="light"] {
  --bg-base:        #edf2fa;
  --bg-surface:     #f4f8ff;
  --bg-card:        #ffffff;
  --bg-card-hover:  #f0f6ff;
  --bg-modal:       #ffffff;
  --bg-header:      #e4ecf8;

  --border:         rgba(100, 150, 220, 0.22);
  --border-bright:  rgba(60, 120, 200, 0.40);
  --border-glow:    rgba(0, 140, 220, 0.20);

  --cyan:           #0077bb;
  --cyan-2:         #005a99;
  --cyan-dim:       rgba(0, 119, 187, 0.08);
  --cyan-glow:      rgba(0, 119, 187, 0.12);

  --accent:         #6040e0;
  --accent-dim:     rgba(96, 64, 224, 0.08);

  --gold:           #c8900a;
  --gold-dim:       rgba(200, 144, 10, 0.09);

  --success:        #00aa55;
  --danger:         #e02222;
  --warning:        #e07700;

  --sunday-color:   #cc2244;
  --sunday-bg:      rgba(204, 34, 68, 0.05);

  --today-bg:       rgba(0, 119, 187, 0.10);
  --today-border:   #0077bb;
  --today-glow:     0 0 12px rgba(0, 119, 187, 0.22);

  --text-primary:   #0d1a2e;
  --text-secondary: #3a5a7a;
  --text-muted:     #8aa4bc;

  --shadow-card:    0 2px 14px rgba(0, 50, 120, 0.09);
  --shadow-modal:   0 12px 48px rgba(0, 30, 90, 0.18);
}

/* ============================================================
   2. RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg-base);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.5;
  transition: background var(--transition-slow), color var(--transition-slow);
  -webkit-font-smoothing: antialiased;
}

/* Grid BG texture */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 44px 44px;
  opacity: 0.45;
}

/* Ambient glow blobs */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 40% at 10% 20%, rgba(0,140,255,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 50% 35% at 90% 75%, rgba(124,92,252,0.07) 0%, transparent 70%);
}

/* ============================================================
   3. SCROLLBAR
   ============================================================ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

/* ============================================================
   4. LAYOUT WRAPPER
   ============================================================ */
#app {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  min-height: 100vh;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 20px 40px;
}

/* ============================================================
   5. TOP BAR / HEADER
   ============================================================ */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 0;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}

/* Logo placeholder / image */
.brand-logo {
  width: 44px; height: 44px;
  border-radius: 10px;
  background: linear-gradient(135deg, #004d99, #0088cc);
  border: 1px solid var(--border-bright);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.brand-logo img { width: 100%; height: 100%; object-fit: contain; }
.brand-logo .logo-fallback {
  font-family: var(--font-display);
  font-size: 16px; font-weight: 700;
  color: var(--cyan);
  letter-spacing: 0.5px;
}

.brand-text { line-height: 1.2; }
.brand-name {
  font-family: var(--font-display);
  font-size: 18px; font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}
.brand-name span { color: var(--cyan); }
.brand-tagline {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 2.5px;
  text-transform: uppercase;
  font-family: var(--font-mono);
}

/* Name input */
.name-input-wrap {
  display: flex; align-items: center; gap: 8px;
  flex: 1; min-width: 180px; max-width: 300px;
}
.name-input-wrap label {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  white-space: nowrap;
  font-family: var(--font-mono);
}
.name-input {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 13px;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.name-input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px var(--cyan-dim);
}
.name-input::placeholder { color: var(--text-muted); }

/* Header actions */
.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ============================================================
   6. BUTTON SYSTEM
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px; border-radius: var(--radius-sm);
  font-family: var(--font-body); font-size: 13px; font-weight: 500;
  cursor: pointer; border: none; outline: none;
  transition: all var(--transition); white-space: nowrap;
  text-decoration: none;
}
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }

.btn-primary {
  background: linear-gradient(135deg, #0055aa, #0099dd);
  color: #fff;
  border: 1px solid rgba(0, 180, 255, 0.3);
  box-shadow: 0 2px 12px rgba(0, 120, 220, 0.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0, 140, 255, 0.40); }

.btn-ghost {
  background: var(--bg-card);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-ghost:hover { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }

.btn-accent {
  background: linear-gradient(135deg, #5533dd, #8855ff);
  color: #fff; border: 1px solid rgba(124,92,252,0.4);
  box-shadow: 0 2px 12px rgba(124, 92, 252, 0.25);
}
.btn-accent:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124, 92, 252, 0.40); }

.btn-icon {
  padding: 9px; border-radius: var(--radius-sm);
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-secondary); cursor: pointer;
  transition: all var(--transition);
  display: inline-flex; align-items: center;
}
.btn-icon:hover { border-color: var(--cyan); color: var(--cyan); }
.btn-icon svg { width: 17px; height: 17px; }

/* ============================================================
   7. CALENDAR SHELL
   ============================================================ */
.cal-shell {
  margin-top: 24px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

/* ── Calendar Header ── */
.cal-header {
  background: var(--bg-header);
  padding: 22px 28px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); gap: 20px; flex-wrap: wrap;
  position: relative; overflow: hidden;
}
/* Decorative line at bottom of header */
.cal-header::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--cyan) 40%, var(--accent) 70%, transparent 100%);
}

.cal-nav { display: flex; align-items: center; gap: 12px; }
.cal-nav-btn {
  width: 38px; height: 38px; border-radius: var(--radius-sm);
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--cyan); cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: all var(--transition); flex-shrink: 0;
}
.cal-nav-btn:hover { background: var(--cyan-dim); border-color: var(--cyan); transform: scale(1.05); }
.cal-nav-btn svg { width: 18px; height: 18px; }

.cal-title {
  font-family: var(--font-display);
  font-size: clamp(22px, 4vw, 32px);
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 2px;
  line-height: 1;
  min-width: 260px;
  text-align: center;
}
.cal-title span { color: var(--cyan); }

.cal-header-right {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}

/* Today badge */
.today-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  letter-spacing: 0.5px;
}
.today-badge span { color: var(--cyan); font-weight: 600; }

/* ── Day‐of‐week Row ── */
.cal-day-headers {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
}
.cal-day-hdr {
  text-align: center;
  padding: 12px 4px;
  font-family: var(--font-display);
  font-size: 12px; font-weight: 600;
  letter-spacing: 2px;
  color: var(--text-muted);
  border-right: 1px solid var(--border);
  text-transform: uppercase;
}
.cal-day-hdr:last-child { border-right: none; }
.cal-day-hdr.sun { color: var(--sunday-color); }

/* ── Days Grid ── */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  /* Adaptive rows: each row has a fixed min-height */
}

/* ── Day Cell ── */
.day-cell {
  min-height: 110px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 8px 8px 6px;
  display: flex; flex-direction: column;
  gap: 3px;
  cursor: pointer;
  transition: background var(--transition);
  position: relative;
  overflow: hidden;
}
.day-cell:nth-child(7n) { border-right: none; }
.day-cell:hover { background: var(--bg-card-hover); }
.day-cell.other-month { background: var(--bg-base); opacity: 0.4; cursor: default; }
.day-cell.other-month:hover { background: var(--bg-base); }
.day-cell.is-sunday .day-num { color: var(--sunday-color); }
.day-cell.is-sunday { background: var(--sunday-bg); }
.day-cell.is-today {
  background: var(--today-bg) !important;
  box-shadow: inset 0 0 0 1.5px var(--today-border);
}
.day-cell.has-permanent .day-num::after {
  content: '✦';
  font-size: 7px; color: var(--gold);
  position: absolute; top: 7px; right: 8px;
}

/* Day number */
.day-num {
  font-family: var(--font-display);
  font-size: 18px; font-weight: 700;
  line-height: 1;
  color: var(--text-primary);
  position: relative; align-self: flex-start;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  flex-shrink: 0;
}
.day-cell.is-today .day-num {
  background: var(--cyan);
  color: #fff !important;
  box-shadow: var(--today-glow);
}

/* Events container */
.events-list {
  display: flex; flex-direction: column; gap: 2px;
  flex: 1; overflow: hidden;
}

/* Individual event pill */
.event-pill {
  display: flex; align-items: center; gap: 4px;
  padding: 2px 6px; border-radius: 4px;
  font-size: 10.5px; font-weight: 500; line-height: 1.3;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  cursor: pointer; transition: opacity var(--transition);
  max-width: 100%; font-family: var(--font-body);
}
.event-pill:hover { opacity: 0.8; }
.event-pill .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.event-pill.permanent { font-style: italic; }

/* "+N more" label */
.more-events {
  font-size: 9.5px; color: var(--text-muted); font-family: var(--font-mono);
  padding: 1px 4px; cursor: pointer;
}
.more-events:hover { color: var(--cyan); }

/* Color themes for events */
.ev-c1 { background: rgba(0,200,255,0.15); color: var(--event-1); }
.ev-c1 .dot { background: var(--event-1); }
.ev-c2 { background: rgba(124,92,252,0.15); color: var(--event-2); }
.ev-c2 .dot { background: var(--event-2); }
.ev-c3 { background: rgba(0,230,118,0.15); color: var(--event-3); }
.ev-c3 .dot { background: var(--event-3); }
.ev-c4 { background: rgba(244,196,48,0.15); color: var(--event-4); }
.ev-c4 .dot { background: var(--event-4); }
.ev-c5 { background: rgba(255,85,119,0.15); color: var(--event-5); }
.ev-c5 .dot { background: var(--event-5); }

/* ── Calendar Footer / Status Bar ── */
.cal-footer {
  background: var(--bg-header);
  border-top: 1px solid var(--border);
  padding: 10px 24px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px;
}
.cal-footer-left {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 6px var(--success);
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.status-text { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.status-text span { color: var(--cyan); font-weight: 600; }

/* Legend */
.legend { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ============================================================
   8. TOOLBAR (below header)
   ============================================================ */
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin: 20px 0 0; flex-wrap: wrap;
}
.toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* Export dropdown */
.export-wrap { position: relative; }
.export-menu {
  position: absolute; right: 0; top: calc(100% + 6px);
  background: var(--bg-modal); border: 1px solid var(--border-bright);
  border-radius: var(--radius); padding: 6px;
  display: none; flex-direction: column; gap: 2px;
  min-width: 150px; z-index: 200;
  box-shadow: var(--shadow-modal);
  animation: fadeDown 0.18s ease;
}
.export-menu.open { display: flex; }
@keyframes fadeDown { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.export-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; border-radius: var(--radius-sm);
  font-size: 13px; color: var(--text-secondary);
  cursor: pointer; transition: background var(--transition), color var(--transition);
  font-family: var(--font-body);
}
.export-item:hover { background: var(--cyan-dim); color: var(--cyan); }
.export-item svg { width: 14px; height: 14px; flex-shrink: 0; }

/* ============================================================
   9. MODAL — Add / Edit Event
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(2, 6, 16, 0.75);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-overlay.active { opacity: 1; pointer-events: all; }

.modal {
  background: var(--bg-modal);
  border: 1px solid var(--border-bright);
  border-radius: var(--radius-xl);
  width: 100%; max-width: 480px;
  box-shadow: var(--shadow-modal);
  transform: translateY(20px) scale(0.96);
  transition: transform 0.25s cubic-bezier(0.34, 1.4, 0.64, 1);
  overflow: hidden;
}
.modal-overlay.active .modal { transform: translateY(0) scale(1); }

.modal-header {
  background: var(--bg-header);
  padding: 20px 24px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.modal-title {
  font-family: var(--font-display);
  font-size: 18px; font-weight: 700; letter-spacing: 1px;
  color: var(--text-primary);
}
.modal-close {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.modal-close:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
.modal-close svg { width: 14px; height: 14px; }

.modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label {
  font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--text-muted);
  font-family: var(--font-mono);
}
.form-input, .form-select, .form-textarea {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  color: var(--text-primary);
  font-family: var(--font-body); font-size: 14px;
  outline: none; width: 100%;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px var(--cyan-dim);
}
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }
.form-select { cursor: pointer; }
.form-select option { background: var(--bg-card); }
.form-textarea { resize: vertical; min-height: 80px; }

/* Color picker row */
.color-row { display: flex; gap: 8px; flex-wrap: wrap; }
.color-swatch {
  width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent;
  transition: all var(--transition); flex-shrink: 0;
}
.color-swatch.selected, .color-swatch:hover { transform: scale(1.25); border-color: #fff; }

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: flex-end; gap: 10px;
}

/* ============================================================
   10. DAY DETAIL PANEL (Event List Modal)
   ============================================================ */
.detail-modal { max-width: 420px; }
.detail-date-label {
  font-family: var(--font-display);
  font-size: 28px; font-weight: 700; letter-spacing: 2px;
  color: var(--cyan);
}
.detail-events-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.detail-event-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px;
}
.detail-event-item .ev-name {
  flex: 1; font-size: 13px; font-weight: 500; color: var(--text-primary);
}
.detail-event-item .ev-note { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.detail-event-item .ev-actions { display: flex; gap: 6px; }
.ev-action-btn {
  width: 28px; height: 28px; border-radius: 6px;
  background: var(--bg-surface); border: 1px solid var(--border);
  color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.ev-action-btn:hover { border-color: var(--cyan); color: var(--cyan); }
.ev-action-btn.del:hover { border-color: var(--danger); color: var(--danger); }
.ev-action-btn svg { width: 13px; height: 13px; }
.no-events-msg {
  text-align: center; color: var(--text-muted); font-size: 13px;
  padding: 20px; font-family: var(--font-mono);
}

/* ============================================================
   11. TOAST NOTIFICATIONS
   ============================================================ */
.toast-container {
  position: fixed; bottom: 28px; right: 28px; z-index: 900;
  display: flex; flex-direction: column; gap: 10px;
  pointer-events: none;
}
.toast {
  background: var(--bg-modal); border: 1px solid var(--border-bright);
  border-radius: var(--radius); padding: 12px 18px;
  font-size: 13px; color: var(--text-primary);
  box-shadow: var(--shadow-modal); max-width: 300px;
  display: flex; align-items: center; gap: 10px;
  animation: toastIn 0.3s ease;
  pointer-events: all;
}
@keyframes toastIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
.toast.fade-out { animation: toastOut 0.3s ease forwards; }
@keyframes toastOut { to{opacity:0;transform:translateX(20px)} }
.toast-icon { font-size: 16px; flex-shrink: 0; }

/* ============================================================
   12. EXPORT OVERLAY
   ============================================================ */
.export-overlay {
  position: fixed; inset: 0; z-index: 600;
  background: rgba(2,6,16,0.90); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.export-overlay.active { opacity: 1; pointer-events: all; }
.export-box {
  background: var(--bg-modal); border: 1px solid var(--border-bright);
  border-radius: var(--radius-xl); padding: 40px 48px;
  text-align: center; box-shadow: var(--shadow-modal);
}
.export-spinner {
  width: 44px; height: 44px; border: 3px solid var(--border);
  border-top-color: var(--cyan); border-radius: 50%;
  margin: 0 auto 16px; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.export-label {
  font-family: var(--font-display); font-size: 16px; font-weight: 600;
  color: var(--cyan); letter-spacing: 2px;
}

/* ============================================================
   13. RESPONSIVE
   ============================================================ */
@media (max-width: 900px) {
  .day-cell { min-height: 80px; }
  .cal-title { font-size: 20px; min-width: 0; }
}

@media (max-width: 680px) {
  #app { padding: 0 12px 32px; }
  .top-bar { gap: 12px; }
  .name-input-wrap { max-width: 100%; }
  .cal-header { padding: 16px; flex-direction: column; align-items: flex-start; }
  .cal-title { font-size: 22px; text-align: left; min-width: 0; }
  .day-cell { min-height: 56px; padding: 5px 4px 4px; }
  .day-num { font-size: 13px; width: 24px; height: 24px; }
  .event-pill { font-size: 9px; padding: 1px 4px; }
  .cal-day-hdr { font-size: 10px; letter-spacing: 0; padding: 8px 2px; }
  .cal-footer { flex-direction: column; align-items: flex-start; }
  .toolbar { flex-direction: column; align-items: flex-start; }
}

@media (max-width: 420px) {
  .day-cell { min-height: 44px; }
  .day-num { font-size: 11px; }
  .event-pill { display: none; }
  .more-events { font-size: 8px; }
}

/* ============================================================
   14. PRINT STYLES
   ============================================================ */
@media print {
  body { background: #fff !important; color: #000 !important; }
  body::before, body::after { display: none; }
  #app { max-width: 100%; padding: 0; }
  .toolbar, .header-actions, .cal-footer, .toast-container,
  .modal-overlay, .export-overlay, .export-wrap { display: none !important; }
  .cal-shell { box-shadow: none !important; border: 1px solid #ccc !important; border-radius: 0; }
  .cal-header { background: #f0f6ff !important; border-bottom: 2px solid #0077bb !important; }
  .cal-title { color: #000 !important; }
  .cal-title span { color: #0077bb !important; }
  .top-bar { border-bottom: 2px solid #0077bb; padding: 12px 0; }
  .brand-name { color: #000 !important; }
  .brand-name span { color: #0077bb !important; }
  .brand-tagline { color: #666 !important; }
  .name-display-print { display: block !important; font-size: 13px; color: #444; margin-top: 2px; }
  .name-input-wrap { display: none !important; }
  .day-cell {
    min-height: 80px !important;
    background: #fff !important;
    border: 1px solid #ddd !important;
    page-break-inside: avoid;
  }
  .day-cell.is-today { background: #e8f4ff !important; box-shadow: none !important; }
  .day-num { color: #000 !important; }
  .day-cell.is-today .day-num { background: #0077bb !important; color: #fff !important; }
  .day-cell.is-sunday .day-num { color: #cc0033 !important; }
  .cal-day-hdr { color: #555 !important; border: none; background: #f0f6ff !important; }
  .event-pill { background: #eee !important; color: #333 !important; }
  .cal-grid, .cal-day-headers { break-inside: avoid; }
  @page { margin: 1cm; }
}

/* Hidden in screen, shown in print */
.name-display-print { display: none; }

/* ============================================================
   15. MISC ANIMATIONS
   ============================================================ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.cal-shell { animation: fadeUp 0.4s ease both; }

/* Hover "add" indicator on day cell */

  opacity: 0; transition: opacity var(--transition);
  font-family: var(--font-mono); line-height: 1;
}
.day-cell:not(.other-month):hover::after { opacity: 0.4; }
</style>
</head>

<!-- ═══════════════════════════════════════════
     JAVASCRIPT
     ═══════════════════════════════════════════ -->
<script>
'use strict';

/* ============================================================
   CONSTANTS
   ============================================================ */
const MONTHS = [
  'January','February','March','April','May','June',
  'July','August','September','October','November','December'
];
const DAY_ABBR = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/**
 * Permanent / predefined QCDS events.
 * Key format: "YYYY-MM-DD"  →  array of event objects
 * (Year-agnostic entries use "0000-MM-DD" and are matched by MM-DD)
 */
const PERMANENT_EVENTS = {
  // Fixed-date Indian national & public holidays (year-agnostic, matched by MM-DD)
  '0000-01-01': [{ title: "New Year's Day",    color: 'c4', permanent: true }],
  '0000-01-14': [{ title: 'Makar Sankranti',   color: 'c4', permanent: true }],
  '0000-01-26': [{ title: 'Republic Day',      color: 'c4', permanent: true }],
  '0000-04-14': [{ title: 'Dr. Ambedkar Jayanti', color: 'c4', permanent: true }],
  '0000-05-01': [{ title: 'Labour Day',        color: 'c4', permanent: true }],
  '0000-08-15': [{ title: 'Independence Day',  color: 'c4', permanent: true }],
  '0000-10-02': [{ title: 'Gandhi Jayanti',    color: 'c4', permanent: true }],
  '0000-11-14': [{ title: "Children's Day",    color: 'c4', permanent: true }],
  '0000-12-25': [{ title: 'Christmas Day',     color: 'c4', permanent: true }],
  // QCDS org events (specific year)
  '2023-01-01': [{ title: 'QCDS Founded',      color: 'c1', permanent: true }],
  '2026-01-01': [{ title: 'QCDS 3rd Year!',   color: 'c3', permanent: true }],
};

const STORAGE_KEY = 'qcds_cal_events_v2';
const THEME_KEY   = 'qcds_cal_theme';
const NAME_KEY    = 'qcds_cal_name';

/* ============================================================
   STATE
   ============================================================ */
let state = {
  year:        new Date().getFullYear(),
  month:       new Date().getMonth(),          // 0-based
  userEvents:  {},                             // { "YYYY-MM-DD": [{ id, title, note, color }] }
  editingId:   null,
  selectedDate:null,
  selectedColor: 'c1',
};

/* ============================================================
   HELPERS
   ============================================================ */
const $ = id => document.getElementById(id);
const today = () => new Date();

function pad2(n) { return String(n).padStart(2, '0'); }

function dateKey(y, m, d) {
  return `${y}-${pad2(m + 1)}-${pad2(d)}`;
}

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

/**
 * Get all events for a given date (permanent + user).
 */
function eventsForDate(y, m, d) {
  const key     = dateKey(y, m, d);
  const monoKey = `0000-${pad2(m + 1)}-${pad2(d)}`;

  const perm = [
    ...(PERMANENT_EVENTS[key]    || []),
    ...(PERMANENT_EVENTS[monoKey]|| []),
  ].map(e => ({ ...e, id: 'perm_' + (e.title.replace(/\s/g,'_')) }));

  const user = state.userEvents[key] || [];
  return [...perm, ...user];
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function saveEvents() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.userEvents)); } catch(e) {}
}
function loadEvents() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.userEvents = JSON.parse(raw);
  } catch(e) { state.userEvents = {}; }
}
function saveName(name) {
  try { localStorage.setItem(NAME_KEY, name); } catch(e) {}
}
function loadName() {
  try { return localStorage.getItem(NAME_KEY) || ''; } catch(e) { return ''; }
}
function saveTheme(t) {
  try { localStorage.setItem(THEME_KEY, t); } catch(e) {}
}
function loadTheme() {
  try { return localStorage.getItem(THEME_KEY) || 'dark'; } catch(e) { return 'dark'; }
}

/* ============================================================
   CALENDAR RENDERING
   ============================================================ */
function renderCalendar() {
  const { year, month } = state;
  const t = today();
  const todayY = t.getFullYear();
  const todayM = t.getMonth();
  const todayD = t.getDate();

  // Update header
  $('calMonth').textContent = MONTHS[month];
  $('calYear').innerHTML    = `<span>${year}</span>`;
  $('todayStr').textContent = `${MONTHS[todayM].slice(0,3)} ${todayD}, ${todayY}`;

  // Build grid
  const grid = $('calGrid');
  grid.innerHTML = '';

  const firstDay  = new Date(year, month, 1).getDay();  // 0=Sun
  const daysInMo  = new Date(year, month + 1, 0).getDate();
  const prevDays  = new Date(year, month, 0).getDate();

  // Total cells: must be multiple of 7, at least 35
  const totalCells = Math.ceil((firstDay + daysInMo) / 7) * 7;

  let evCount = 0;

  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell';

    let cellDate, cellYear, cellMonth, cellDay, isOther = false;

    if (i < firstDay) {
      // Previous month
      cellDay   = prevDays - firstDay + 1 + i;
      cellMonth = month - 1 < 0 ? 11 : month - 1;
      cellYear  = month - 1 < 0 ? year - 1 : year;
      isOther   = true;
    } else if (i >= firstDay + daysInMo) {
      // Next month
      cellDay   = i - firstDay - daysInMo + 1;
      cellMonth = month + 1 > 11 ? 0 : month + 1;
      cellYear  = month + 1 > 11 ? year + 1 : year;
      isOther   = true;
    } else {
      cellDay   = i - firstDay + 1;
      cellMonth = month;
      cellYear  = year;
    }

    const weekday = i % 7; // 0=Sun
    const isToday = (cellYear === todayY && cellMonth === todayM && cellDay === todayD);
    const isSun   = weekday === 0;
    const events  = eventsForDate(cellYear, cellMonth, cellDay);
    const hasPerm = events.some(e => e.permanent);

    if (isOther)  cell.classList.add('other-month');
    if (isToday)  cell.classList.add('is-today');
    if (isSun)    cell.classList.add('is-sunday');
    if (hasPerm)  cell.classList.add('has-permanent');

    // Day number
    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = cellDay;
    cell.appendChild(numEl);

    // Events list
    if (!isOther && events.length > 0) {
      evCount += events.filter(e => !e.permanent).length;
      const listEl = document.createElement('div');
      listEl.className = 'events-list';
      const maxShow = 3;
      events.slice(0, maxShow).forEach(ev => {
        const pill = document.createElement('div');
        pill.className = `event-pill ev-${ev.color}${ev.permanent ? ' permanent' : ''}`;
        pill.innerHTML = `<span class="dot"></span>${ev.title}`;
        pill.addEventListener('click', e => {
          e.stopPropagation();
          openDetailModal(cellYear, cellMonth, cellDay);
        });
        listEl.appendChild(pill);
      });
      if (events.length > maxShow) {
        const more = document.createElement('div');
        more.className = 'more-events';
        more.textContent = `+${events.length - maxShow} more`;
        more.addEventListener('click', e => {
          e.stopPropagation();
          openDetailModal(cellYear, cellMonth, cellDay);
        });
        listEl.appendChild(more);
      }
      cell.appendChild(listEl);
    }

    // Click to open detail / add
    if (!isOther) {
      cell.addEventListener('click', () => {
        openDetailModal(cellYear, cellMonth, cellDay);
      });
    }

    grid.appendChild(cell);
  }

  // Also count permanent events in current month for the footer
  for (let d = 1; d <= daysInMo; d++) {
    evCount += eventsForDate(year, month, d).filter(e => e.permanent).length;
  }
  // Just show user events in count
  let userCount = 0;
  for (let d = 1; d <= daysInMo; d++) {
    userCount += (state.userEvents[dateKey(year, month, d)] || []).length;
  }
  $('eventCount').textContent = userCount;
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function goToMonth(delta) {
  state.month += delta;
  if (state.month > 11) { state.month = 0; state.year++; }
  if (state.month < 0)  { state.month = 11; state.year--; }
  renderCalendar();
}

function goToToday() {
  const t = today();
  state.year  = t.getFullYear();
  state.month = t.getMonth();
  renderCalendar();
  toast('📅 Jumped to today', 'info');
}

/* ============================================================
   THEME
   ============================================================ */
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  saveTheme(t);
  // Update icon: sun = dark mode indicator, moon = light mode indicator
  const icon = $('themeIcon');
  if (t === 'dark') {
    // Show sun icon (you're in dark, click to go light)
    icon.innerHTML = `
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
  } else {
    // Show moon icon (you're in light, click to go dark)
    icon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
  }
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
}

/* ============================================================
   MODAL UTILITIES
   ============================================================ */
function openModal(id) {
  $(id).classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  $(id).classList.remove('active');
  document.body.style.overflow = '';
}

/* ============================================================
   ADD / EDIT EVENT MODAL
   ============================================================ */
function openAddEventModal(dateStr) {
  state.editingId = null;
  $('modalTitle').textContent = 'Add Event';
  $('eventDate').value  = dateStr || '';
  $('eventTitle').value = '';
  $('eventNote').value  = '';
  selectColor('c1');
  openModal('eventModal');
  setTimeout(() => $('eventTitle').focus(), 100);
}

function openEditModal(evId, dateKey) {
  const events = state.userEvents[dateKey] || [];
  const ev = events.find(e => e.id === evId);
  if (!ev) return;
  state.editingId = evId;
  $('modalTitle').textContent = 'Edit Event';
  $('editEventId').value = evId;
  $('eventDate').value   = dateKey;
  $('eventTitle').value  = ev.title;
  $('eventNote').value   = ev.note || '';
  selectColor(ev.color || 'c1');
  closeModal('detailModal');
  openModal('eventModal');
  setTimeout(() => $('eventTitle').focus(), 100);
}

function selectColor(c) {
  state.selectedColor = c;
  document.querySelectorAll('.color-swatch').forEach(sw => {
    sw.classList.toggle('selected', sw.dataset.color === c);
  });
}

function saveEventFromModal() {
  const dateVal  = $('eventDate').value;
  const titleVal = $('eventTitle').value.trim();
  if (!dateVal || !titleVal) {
    toast('⚠️ Please fill in date and title', 'warn');
    return;
  }

  if (state.editingId) {
    // Edit mode
    const arr = state.userEvents[dateVal] || [];
    const idx = arr.findIndex(e => e.id === state.editingId);
    if (idx !== -1) {
      arr[idx].title = titleVal;
      arr[idx].note  = $('eventNote').value.trim();
      arr[idx].color = state.selectedColor;
      state.userEvents[dateVal] = arr;
    }
    toast('✅ Event updated', 'success');
  } else {
    // New event
    if (!state.userEvents[dateVal]) state.userEvents[dateVal] = [];
    state.userEvents[dateVal].push({
      id:    uid(),
      title: titleVal,
      note:  $('eventNote').value.trim(),
      color: state.selectedColor,
    });
    toast('✅ Event added', 'success');
  }

  saveEvents();
  closeModal('eventModal');
  renderCalendar();
}

/* ============================================================
   DAY DETAIL MODAL
   ============================================================ */
function openDetailModal(y, m, d) {
  const key = dateKey(y, m, d);
  state.selectedDate = { y, m, d, key };

  const dateObj = new Date(y, m, d);
  $('detailTitle').textContent = DAY_ABBR[dateObj.getDay()] + ', ' + MONTHS[m];
  $('detailDate').textContent  = `${pad2(d)} ${MONTHS[m].slice(0,3).toUpperCase()} ${y}`;

  const events = eventsForDate(y, m, d);
  const list   = $('detailEventsList');
  list.innerHTML = '';

  if (events.length === 0) {
    list.innerHTML = '<div class="no-events-msg">// No events — click "Add Event Here"</div>';
  } else {
    events.forEach(ev => {
      const item = document.createElement('div');
      item.className = 'detail-event-item';
      const colorVal = `var(--event-${ev.color ? ev.color.slice(1) : '1'})`;
      item.innerHTML = `
        <div class="legend-dot" style="background:${colorVal};width:10px;height:10px;border-radius:50%;flex-shrink:0"></div>
        <div style="flex:1;min-width:0">
          <div class="ev-name">${ev.title}</div>
          ${ev.note ? `<div class="ev-note">${ev.note}</div>` : ''}
          ${ev.permanent ? `<div class="ev-note" style="color:var(--gold)">★ Official holiday / QCDS event</div>` : ''}
        </div>
        ${!ev.permanent ? `
        <div class="ev-actions">
          <button class="ev-action-btn" onclick="openEditModal('${ev.id}','${key}')" title="Edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
          <button class="ev-action-btn del" onclick="deleteEvent('${ev.id}','${key}')" title="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/>
              <path d="M9 6V4h6v2"/>
            </svg>
          </button>
        </div>` : ''}
      `;
      list.appendChild(item);
    });
  }

  openModal('detailModal');
}

function deleteEvent(evId, key) {
  const arr = state.userEvents[key] || [];
  state.userEvents[key] = arr.filter(e => e.id !== evId);
  if (state.userEvents[key].length === 0) delete state.userEvents[key];
  saveEvents();
  renderCalendar();
  // Refresh detail modal
  if (state.selectedDate) {
    const { y, m, d } = state.selectedDate;
    openDetailModal(y, m, d);
  }
  toast('🗑️ Event deleted', 'info');
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg, type='info') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="toast-icon">${{info:'ℹ️',success:'✅',warn:'⚠️',error:'❌'}[type]||'ℹ️'}</span><span>${msg}</span>`;
  $('toastContainer').appendChild(t);
  setTimeout(() => {
    t.classList.add('fade-out');
    setTimeout(() => t.remove(), 350);
  }, 3000);
}

/* ============================================================
   EXPORT FUNCTIONS
   ============================================================ */
function showExportOverlay(msg) {
  $('exportLabel').textContent = msg;
  $('exportOverlay').classList.add('active');
}
function hideExportOverlay() {
  $('exportOverlay').classList.remove('active');
}

async function exportImage(format) {
  $('exportMenu').classList.remove('open');
  showExportOverlay(`GENERATING ${format.toUpperCase()}…`);
  await new Promise(r => setTimeout(r, 80));
  try {
    const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
    const canvas = await html2canvas($('calShell'), {
      scale: 2.5,
      useCORS: true,
      logging: false,
      backgroundColor: isDark ? '#050c1a' : '#f4f8ff',
      ignoreElements: el => el.classList.contains('modal-overlay'),
    });
    const { year, month } = state;
    const fname = `QCDS_Calendar_${MONTHS[month]}_${year}`;
    const a = document.createElement('a');
    if (format === 'png') {
      a.download = fname + '.png';
      a.href = canvas.toDataURL('image/png');
    } else {
      a.download = fname + '.jpg';
      a.href = canvas.toDataURL('image/jpeg', 0.95);
    }
    a.click();
    toast(`📥 Calendar saved as ${format.toUpperCase()}`, 'success');
  } catch(err) {
    toast('❌ Export failed: ' + err.message, 'error');
  } finally {
    hideExportOverlay();
  }
}

/* ============================================================
   EVENT BINDINGS
   ============================================================ */
function bindEvents() {
  // Navigation
  $('prevBtn').addEventListener('click', () => goToMonth(-1));
  $('nextBtn').addEventListener('click', () => goToMonth(1));
  $('todayBtn').addEventListener('click', goToToday);

  // Theme
  $('themeBtn').addEventListener('click', toggleTheme);

  // Add event (toolbar)
  $('addEventBtn').addEventListener('click', () => {
    const t = today();
    openAddEventModal(dateKey(t.getFullYear(), t.getMonth(), t.getDate()));
  });

  // Event modal
  $('modalClose').addEventListener('click', () => closeModal('eventModal'));
  $('modalCancel').addEventListener('click', () => closeModal('eventModal'));
  $('modalSave').addEventListener('click', saveEventFromModal);
  $('eventModal').addEventListener('click', e => {
    if (e.target === $('eventModal')) closeModal('eventModal');
  });

  // Color swatches
  document.querySelectorAll('.color-swatch').forEach(sw => {
    sw.addEventListener('click', () => selectColor(sw.dataset.color));
  });

  // Enter key in event title
  $('eventTitle').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveEventFromModal();
  });

  // Detail modal
  $('detailClose').addEventListener('click', () => closeModal('detailModal'));
  $('detailClose2').addEventListener('click', () => closeModal('detailModal'));
  $('detailModal').addEventListener('click', e => {
    if (e.target === $('detailModal')) closeModal('detailModal');
  });
  $('detailAddBtn').addEventListener('click', () => {
    if (state.selectedDate) {
      const { y, m, d } = state.selectedDate;
      closeModal('detailModal');
      openAddEventModal(dateKey(y, m, d));
    }
  });

  // Export menu toggle
  $('exportBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    $('exportMenu').classList.toggle('open');
  });
  document.addEventListener('click', () => $('exportMenu').classList.remove('open'));
  $('exportMenu').addEventListener('click', e => e.stopPropagation());

  $('expPng').addEventListener('click',   () => exportImage('png'));
  $('expJpg').addEventListener('click',   () => exportImage('jpg'));
  $('expPrint').addEventListener('click', () => { $('exportMenu').classList.remove('open'); window.print(); });

  // Name field
  const nameEl = $('userName');
  nameEl.value = loadName();
  updateNamePrint(nameEl.value);
  nameEl.addEventListener('input', () => {
    saveName(nameEl.value);
    updateNamePrint(nameEl.value);
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft')  goToMonth(-1);
    if (e.key === 'ArrowRight') goToMonth(1);
    if (e.key === 'Escape') {
      closeModal('eventModal');
      closeModal('detailModal');
    }
    if (e.key === 't' || e.key === 'T') goToToday();
    if (e.key === 'n' || e.key === 'N') {
      const t = today();
      openAddEventModal(dateKey(t.getFullYear(), t.getMonth(), t.getDate()));
    }
  });
}

function updateNamePrint(name) {
  $('namePrint').textContent = name ? `Prepared for: ${name}` : '';
}

/* ============================================================
   INIT
   ============================================================ */
(function init() {
  // Load persisted state
  loadEvents();
  setTheme(loadTheme());

  // Bind all events
  bindEvents();

  // Render calendar
  renderCalendar();
})();
</script>
</body>
