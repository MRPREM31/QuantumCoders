<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Attendance Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    .card {
      max-width: 420px;
      margin: auto;
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.1);
      text-align: center;
    }

    img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    h2 {
      margin: 10px 0 5px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 10px;
    }

    hr {
      margin: 20px 0;
    }

    p {
      margin: 8px 0;
      font-size: 15px;
    }

    a {
      color: #0066cc;
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="card">
  <img id="photo" src="default.png" alt="Profile Photo">
  <h2 id="name">Loading...</h2>
  <p id="email"></p>
  <span id="badge" class="badge"></span>

  <hr>

  <p>📍 Last Location: <span id="location">Loading...</span></p>
  <p>🕒 Last Attendance: <span id="time">Loading...</span></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import {
    getFirestore,
    doc,
    getDoc,
    collection,
    query,
    where,
    orderBy,
    limit,
    getDocs
  } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  // 🔥 Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyDvOsbdPqY57dhsn4KsBOr_IIy94ULp0S0",
    authDomain: "smartattendance-gdg.firebaseapp.com",
    projectId: "smartattendance-gdg"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 🔗 Get UID from URL
  const uid = new URLSearchParams(window.location.search).get("uid");

  if (!uid) {
    document.body.innerHTML = "<h2>Invalid QR Code</h2>";
    throw new Error("UID missing");
  }

  // ================= USER PROFILE =================
  const userRef = doc(db, "users", uid);
  const userSnap = await getDoc(userRef);

  if (userSnap.exists()) {
    const d = userSnap.data();
    console.log("USER DATA:", d);

    document.getElementById("name").innerText = d.name ?? "N/A";
    document.getElementById("email").innerText = d.email ?? "";
    document.getElementById("photo").src = d.photoUrl ?? "default.png";

    const badge = document.getElementById("badge");

    if (d.role === "teacher") {
      badge.innerText = "🟢 Verified Teacher";
      badge.style.background = "#2ecc71";
    } else {
      badge.innerText = "🔵 Verified Student";
      badge.style.background = "#3498db";
    }
  } else {
    document.getElementById("name").innerText = "User not found";
  }

  // ================= LAST ATTENDANCE =================
  const q = query(
    collection(db, "attendance_records"),
    where("teacherId", "==", uid),
    orderBy("updatedAt", "desc"),
    limit(1)
  );

  const snap = await getDocs(q);

  if (!snap.empty) {
    const a = snap.docs[0].data();
    console.log("ATTENDANCE DATA:", a);

    document.getElementById("location").innerHTML =
      `<a href="https://maps.google.com/?q=${a.latitude},${a.longitude}" target="_blank">
        ${a.latitude}, ${a.longitude}
      </a>`;

    document.getElementById("time").innerText =
      new Date(a.updatedAt).toLocaleString();
  } else {
    document.getElementById("location").innerText = "Not available";
    document.getElementById("time").innerText = "No attendance found";
  }
</script>

</body>
</html>
