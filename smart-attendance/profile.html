<!DOCTYPE html>
<html>
<head>
  <title>Smart Attendance Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; background:#f4f6f8; padding:20px }
    .card {
      background:#fff; border-radius:12px; padding:20px;
      box-shadow:0 5px 20px rgba(0,0,0,.1)
    }
    .badge {
      display:inline-block; padding:6px 12px;
      background:#2ecc71; color:#fff; border-radius:20px;
      font-size:14px
    }
  </style>
</head>
<body>

<div class="card">
  <img id="photo" width="120" style="border-radius:50%">
  <h2 id="name"></h2>
  <p id="email"></p>
  <span class="badge">🟢 Verified Teacher</span>

  <hr>

  <p>📍 Last Location: <span id="location"></span></p>
  <p>🕒 Last Attendance: <span id="time"></span></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
<script src="profile.js"></script>

</body>
</html>
